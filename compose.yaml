name: crawlindex
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: crawler
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crawler -d crawler"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build: .
    command: [api]
    stop_grace_period: 20s
    environment: &config
      DATABASE_URL: postgres://crawler:local-only@db:5432/crawler?sslmode=disable
      ALLOWED_ORIGINS: http://fixture:8081
      CONTROLLED_FIXTURE_ORIGIN: http://fixture:8081
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    command: [worker]
    stop_grace_period: 30s
    environment: *config
    depends_on:
      db: {condition: service_healthy}
  fixture:
    build: .
    command: [fixture]
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://crawler:local-only@db:5432/crawler?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
volumes:
  data:
