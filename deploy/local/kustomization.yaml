apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crawlindex
resources:
  - namespace.yaml
  - database.yaml
  - services.yaml
configMapGenerator:
  - name: crawler-config
    literals:
      - ALLOWED_ORIGINS=http://fixture:8081
      - CONTROLLED_FIXTURE_ORIGIN=http://fixture:8081
      - WORKER_CONCURRENCY=4
secretGenerator:
  - name: crawler-db
    literals:
      - DATABASE_URL=postgres://crawler:local-only@db:5432/crawler?sslmode=disable
