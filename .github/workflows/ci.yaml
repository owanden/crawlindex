name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Race and PostgreSQL behavior checks
        run: docker compose --profile test run --build --rm test sh -c 'go vet ./... && go test -race -count=1 ./...'
      - name: Build runtime and start two workers
        run: docker compose up --build -d --scale worker=2 api worker fixture
      - name: Verify submission, extraction and search
        run: python3 scripts/demo.py
      - name: Restart API and workers with stored documents
        run: |
          docker compose restart db api worker
          python3 scripts/demo.py
      - name: Render Kubernetes package
        run: kubectl kustomize deploy/local > /tmp/crawlindex.yaml
      - name: Verify exhausted admission budget across restart
        run: python3 scripts/admission_smoke.py --output .work/admission
      - name: Preserve admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-smoke
          if-no-files-found: warn
          path: |
            .work/admission/report.json
            .work/admission/commands.log
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop owned stack
        if: always()
        run: docker compose --profile test down
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified pinned cluster tools
        run: python3 scripts/install_kubernetes_tools.py .work/tools
      - name: Verify real Kubernetes recovery and scaling
        run: python3 scripts/kubernetes_smoke.py --kind "$PWD/.work/tools/kind" --kubectl "$PWD/.work/tools/kubectl" --output .work/kubernetes
      - name: Preserve report and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-smoke
          if-no-files-found: warn
          path: |
            .work/kubernetes/report.json
            .work/kubernetes/commands.log
            .work/kubernetes/pods.json
            .work/kubernetes/events.json
            .work/kubernetes/worker.log
            .work/kubernetes/rendered.yaml
